!
! osmo-bts — Base Transceiver Station (osmo-bts-trx backend)
!
! Connects upward to osmo-bsc via Abis/IPA (OML+RSL on port 3002).
! Connects downward to osmo-trx via the OsmoTRX UDP protocol on port 5700.
!
! NOTE: every comment line must start with '!' in column 0.
! An indented comment is NOT treated as a comment by the parser.
!
log stderr
 logging level all notice
! TRX handshake + NM state machine debugging
 logging level trx debug
 logging level oml debug
 logging level nm debug
!
line vty
 bind 127.0.0.1
!
! phy 0 — TRX physical interface.
! Base port: osmo-trx listens on <base-port> (control) and <base-port+1> (data).
! The BTS 'local' port must equal osmo-trx's 'remote' port and vice versa.
!
phy 0
 osmotrx ip local 127.0.0.1
 osmotrx ip remote 127.0.0.1
 osmotrx base-port local 5800
 osmotrx base-port remote 5700
 instance 0
  osmotrx rx-gain 40
  osmotrx tx-attenuation oml
!
bts 0
 band GSM900
!
! IPA unit-id must match osmo-bsc: bts 0 / ip.access unit_id
!
 ipa unit-id 1800 0
 oml remote-ip 127.0.0.1
 trx 0
  phy 0 instance 0
!
! Timeslot / phys_chan_config belongs in osmo-bsc.cfg, not here.
! The BTS receives its channel layout from the BSC over OML.
!
