!
! osmo-bts — Base Transceiver Station (osmo-bts-trx backend)
!
! Connects upward to osmo-bsc via Abis/IPA (OML+RSL on port 3002).
! Connects downward to osmo-trx via the OsmoTRX UDP protocol on port 5700.
!
log stderr
  logging level all notice
line vty
 bind 127.0.0.1
!
! phy 0 — TRX physical interface
! Must match the osmo-trx bind/remote addresses and base-port.
phy 0
 instance 0
  osmotrx ip local 127.0.0.1
  osmotrx ip remote 127.0.0.1
  !
  ! Base port: osmo-trx listens on <base-port> (control) and
  !            <base-port+1> (data).  Default: 5700/5701.
  osmotrx base-port local 5700
  osmotrx base-port remote 5700
  osmotrx rx-gain 40
  osmotrx tx-attenuation 0
!
bts 0
 band GSM900
 !
 ! IPA unit-id must match osmo-bsc bts 0 / ipa unit-id
 ipa unit-id 1800 0
 !
 ! OML connects to osmo-bsc on loopback
 oml remote-ip 127.0.0.1
 oml remote-port 3002
 !
 gprs mode none
 !
 trx 0
  arfcn 71
  phy 0 instance 0
  !
  ! Timeslot phys_chan_config must match osmo-bsc trx 0 timeslots
  timeslot 0
   phys_chan_config CCCH+SDCCH4
  timeslot 1
   phys_chan_config TCH/F
  timeslot 2
   phys_chan_config TCH/F
  timeslot 3
   phys_chan_config TCH/F
  timeslot 4
   phys_chan_config TCH/F
  timeslot 5
   phys_chan_config TCH/F
  timeslot 6
   phys_chan_config TCH/F
  timeslot 7
   phys_chan_config TCH/H
!
