!
! osmo-hlr — Home Location Register
!
! Subscriber Ki (and COMP128 algorithm) is provisioned by provision_hlr.sh
! at build time (or at runtime by re-running provision_hlr.sh and restarting).
!
log stderr
  logging level all notice
line vty
 bind 127.0.0.1
!
hlr
 database /var/lib/osmocom/hlr.db
 !
 ! GSUP interface — osmo-msc connects here to perform auth/location updates
 ! Port 4222 is the compiled-in default; 'bind port' not supported in HEAD.
 gsup
  bind ip 127.0.0.1
!
