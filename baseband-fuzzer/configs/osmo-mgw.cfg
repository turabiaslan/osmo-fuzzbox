!
! osmo-mgw — Media Gateway (MGCP)
!
! Handles RTP path switching for voice calls.  For this fuzzing setup voice
! calls are not the primary target, but the BSC and MSC both require an
! MGW to be reachable or they refuse to start cleanly.
!
log stderr
  logging level all notice
line vty
 bind 127.0.0.1
!
mgcp
 bind ip 127.0.0.1
 bind port 2427
 !
 ! RTP port range for local endpoints.  Fine for loopback-only lab use.
 rtp port-range 4000 4999
 rtp ip-probing
 rtp keep-alive 30
!
