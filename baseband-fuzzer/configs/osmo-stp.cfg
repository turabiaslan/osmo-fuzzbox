!
! osmo-stp — SS7/SCCP Signal Transfer Point
! Routes SCCP/M3UA messages between osmo-bsc and osmo-msc on loopback.
!
log stderr
  logging level all notice
line vty
 no login
 !bind 127.0.0.1
!
cs7 instance 0
 point-code 0.23.0
 xua rkm routing-key-allocation dynamic-permitted
 listen m3ua 2905
  local-ip 127.0.0.1
  accept-asp-connections dynamic-permitted
 !point-code 0.23.1
 !
 ! Listen for M3UA connections from BSC and MSC ASPs.
 ! (accept-asp-connections removed — implicit in HEAD libosmo-sccp)
 ! MSC TANIMI

 !listen m3ua 2905
  !accept-asp-connections
  !local-ip 127.0.0.1
!
