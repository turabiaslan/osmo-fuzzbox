!
! osmo-stp — SS7/SCCP Signal Transfer Point
! Routes SCCP/M3UA messages between osmo-bsc and osmo-msc on loopback.
!
log stderr
  logging level all notice
line vty
 bind 127.0.0.1
!
cs7 instance 0
 point-code 0.23.1
 !
 ! Listen for M3UA connections from BSC and MSC ASPs.
 ! (accept-asp-connections removed — implicit in HEAD libosmo-sccp)
 !
 listen m3ua 2905
  local-ip 127.0.0.1
!
