!
! osmo-bsc — Base Station Controller
!
log stderr
  logging level all notice
! NM state machine + OML/RSL for TRX enable debugging
  logging level nm debug
  logging level oml debug
  logging level rsl debug
line vty
 bind 127.0.0.1
!
! IPA bind address — BTS connects here for Abis-over-IP OML/RSL
e1_input
 e1_line 0 driver ipa
 ipa bind 127.0.0.1
!
! cs7 instance 0 — M3UA ASP connecting to osmo-stp (BSC side of A-interface)
cs7 instance 0
 point-code 0.23.3
 sccp-address msc-remote
  routing-indicator PC 
  point-code 0.23.1
  
 asp BSC-to-STP 2905 0 m3ua
  remote-ip 127.0.0.1
  role asp
  sctp-role client
 as A-BSC m3ua
  asp BSC-to-STP
  routing-key 0 0.23.3
!
msc 0
 msc-addr msc-remote
network
 network country code 001
 mobile network code 01
 !
 bts 0
  !
  ! BTS type: nanobts = ip.access IPA protocol (used by osmo-bts-trx)
  type osmo-bts
  band GSM900
  !
  ! Cell identity visible to phones
  cell_identity 1
  location_area_code 1
  !
  ! BSIC = NCC(3 bits) | BCC(3 bits).  63 = 111|111.
  base_station_id_code 63
  !
  ! IPA unit-id must match the value in osmo-bts.cfg
  ipa unit-id 1800 0
  !
  ! No GPRS/EDGE for this 2G-CS fuzzing setup
  gprs mode none
  !
  trx 0
   !
   ! ARFCN 71 → GSM900 downlink 881.2 MHz / uplink 836.2 MHz
   arfcn 71
   max_power_red 0
   !
   ! RSL TEI 0 on E1 line 0
   rsl e1 tei 0
   !
   ! Timeslot layout: CCCH+SDCCH4 on TS0 (mandatory), TCH/F on TS1-6,
   ! TCH/H on TS7 for half-rate voice if needed.
   timeslot 0
    phys_chan_config CCCH+SDCCH4
   timeslot 1
    phys_chan_config TCH/F
   timeslot 2
    phys_chan_config TCH/F
   timeslot 3
    phys_chan_config TCH/F
   timeslot 4
    phys_chan_config TCH/F
   timeslot 5
    phys_chan_config TCH/F
   timeslot 6
    phys_chan_config TCH/F
   timeslot 7
    phys_chan_config TCH/H
!
