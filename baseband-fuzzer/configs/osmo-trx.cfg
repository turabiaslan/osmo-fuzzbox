!
! osmo-trx — GSM TRX (transceiver) driving the USRP B210
!
! Exposes the OsmoTRX UDP protocol for osmo-bts on loopback:
!   Control port: 5700
!   Data port:    5701
!
! The B210 FPGA bitfile is pre-installed in /usr/share/uhd/images/ by the
! uhd-firmware package (baked in at container build time — no download needed).
!
log stderr
  logging level all notice
line vty
 bind 127.0.0.1
!
trx
 bind-ip 127.0.0.1
 remote-ip 127.0.0.1
 base-port 5700
 !
 ! Samples-per-symbol.  4 SPS is standard for GSM; requires B210 clock >= 26 MHz.
 tx-sps 4
 rx-sps 4
 !
 ! UHD-specific configuration
 uhd
  !
  ! UHD device string.  "type=b200" matches both B200 and B210 family.
  ! If you have multiple USRPs attached, add serial=<SERIAL> to disambiguate:
  !   args "type=b200,serial=XXXXXXXX"
  args "type=b200"
  !
  ! Master clock rate.  26e6 = 26 MHz (minimum for 4-SPS GSM on B210).
  clock-ref internal
!
