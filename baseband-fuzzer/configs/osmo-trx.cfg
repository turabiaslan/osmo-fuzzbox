!
! osmo-trx — GSM TRX (transceiver) driving the USRP B210
!
! Exposes the OsmoTRX UDP protocol for osmo-bts on loopback:
!   Control port: 5700
!   Data port:    5701
!
log stderr
 logging level all notice
line vty
 bind 127.0.0.1
!
trx
 bind-ip 127.0.0.1
 remote-ip 127.0.0.1
 base-port 5700
! tx-sps 4 is minimum for proper GMSK pulse shaping (cannot go lower)
! rx-sps 1 minimizes USB bandwidth (was 4)
 tx-sps 4
 rx-sps 1
 egprs disable
 dev-args "type=b200"
 clock-ref internal
! Single channel only (no MIMO) — essential for USB 2.0
 chan 0
!
