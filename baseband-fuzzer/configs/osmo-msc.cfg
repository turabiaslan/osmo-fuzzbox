!
! osmo-msc — minimal config for VTY introspection
! mgw and hlr sections removed — using compiled-in defaults
! (127.0.0.1:2427 for MGW, 127.0.0.1:4222 for HLR)
!
log stderr
  logging level all notice
line vty
 bind 127.0.0.1
!
network
 network country code 001
 mobile network code 01
 short name OSG-Lab
 long name OpenSrcGuard-Lab
!
msc
 cs7-instance-a 0
!
! cs7 instance 0 — M3UA ASP connecting to osmo-stp
cs7 instance 0
 point-code 0.23.3
 asp MSC-to-STP 2905 0 m3ua
  remote-ip 127.0.0.1
  role asp
  sctp-role client
 as A-MSC m3ua
  asp MSC-to-STP
  routing-key 2 0.23.3
!
