!
! osmo-bts-virtual — Virtual BTS (no SDR hardware needed)
!
! Uses GSMTAP for the virtual air interface (built-in).
! Connects upward to osmo-bsc via Abis/IPA (OML+RSL on port 3002).
!
log stderr
  logging level all notice
line vty
 bind 127.0.0.1
!
! Minimal phy required by config parser (virtual backend ignores it)
phy 0
 instance 0
!
bts 0
 band GSM900
 !
 ! IPA unit-id must match osmo-bsc bts 0 / ipa unit-id
 ipa unit-id 1800 0
 !
 ! OML connects to osmo-bsc on loopback
 oml remote-ip 127.0.0.1
 !
 trx 0
  phy 0 instance 0
!
